services:
  - type: web
    name: crackerpro-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: crackerpro
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@crackerpro.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN2_EMAIL
        sync: false
      - key: ADMIN2_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://business-finance-[a-z0-9-]+-waisldigital-5107\.vercel\.app
      - key: NOTIFY_ENABLED
        value: "false"
